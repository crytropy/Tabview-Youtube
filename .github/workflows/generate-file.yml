name: Publish Slim Userscript

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - 'userscript/Tabview-Youtube.user.js'
      - '.github/workflows/generate-file.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare slim userscript
        run: cp userscript/Tabview-Youtube.user.js /tmp/Tabview-Youtube.user.js

      - name: Publish generated-files branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin generated-files || true
          if git show-ref --verify --quiet refs/remotes/origin/generated-files; then
            git checkout -B generated-files origin/generated-files
          else
            git checkout --orphan generated-files
            git rm -rf . || true
          fi
          mkdir -p generated
          cp /tmp/Tabview-Youtube.user.js generated/Tabview-Youtube.user.js
          git add generated/Tabview-Youtube.user.js
          if ! git diff --cached --quiet; then
            git commit -m "Publish slim Tabview userscript"
            git push origin generated-files
          fi
